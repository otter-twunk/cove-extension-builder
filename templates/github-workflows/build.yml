name: Build and Release Extensions

on:
  push:
    tags:
      - '*/v*'
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate extension catalog and manifests
        run: node scripts/validate-extension-repo.mjs
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const catalog = JSON.parse(fs.readFileSync('extensions/catalog.json', 'utf8'));
          const matches = catalog.extensions.filter(entry => tag.startsWith(entry.tagPrefix));
          const supportedTags = catalog.extensions.map(entry => `${entry.tagPrefix}v1.0.0`).sort();

          if (matches.length !== 1) {
            console.error(`ERROR: Release tag '${tag}' does not match exactly one extension tag prefix.`);
            console.error('Use the lowercase tagPrefix from extensions/catalog.json, for example:');
            for (const supportedTag of supportedTags) console.error(`  - ${supportedTag}`);
            process.exit(1);
          }

          const extension = matches[0];
          const versionTag = tag.slice(extension.tagPrefix.length);
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(versionTag)) {
            console.error(`ERROR: Release tag '${tag}' has invalid version '${versionTag}'. Expected a semantic version like '${extension.tagPrefix}v1.0.0'.`);
            process.exit(1);
          }

          console.log(`Release tag '${tag}' targets ${extension.name} (${extension.id}) version ${versionTag.slice(1)}.`);
          NODE
      - name: Build extension matrix
        id: catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('extensions/catalog.json', 'utf8'));
          let extensions = catalog.extensions;

          if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
            const tag = process.env.GITHUB_REF_NAME;
            extensions = extensions.filter(entry => tag.startsWith(entry.tagPrefix));
          }

          if (extensions.length === 0) {
            console.error(`ERROR: No extension matches release tag '${process.env.GITHUB_REF_NAME}'.`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ extension: extensions })}\n`);
          NODE

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    steps:
      - name: Check if this extension was tagged
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == "${{ matrix.extension.tagPrefix }}"* ]]; then
              echo "match=true" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#${{ matrix.extension.tagPrefix }}v}" >> "$GITHUB_OUTPUT"
            else
              echo "match=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.match == 'true'

      - name: Setup .NET
        if: steps.check.outputs.match == 'true' && !matrix.extension.manifestOnly
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: steps.check.outputs.match == 'true' && !matrix.extension.manifestOnly
        run: dotnet restore ${{ matrix.extension.path }} -p:UseLocalCoveSource=false -p:UseLocalCoveCore=false

      - name: Build
        if: steps.check.outputs.match == 'true' && !matrix.extension.manifestOnly
        run: dotnet build ${{ matrix.extension.path }} -c Release --no-restore -p:Version=${{ steps.check.outputs.version }} -p:ContinuousIntegrationBuild=true -p:UseLocalCoveSource=false -p:UseLocalCoveCore=false

      - name: Publish
        if: steps.check.outputs.match == 'true' && !matrix.extension.manifestOnly
        run: dotnet publish ${{ matrix.extension.path }} -c Release -o artifacts/${{ matrix.extension.name }} --no-build -p:Version=${{ steps.check.outputs.version }} -p:ContinuousIntegrationBuild=true -p:UseLocalCoveSource=false -p:UseLocalCoveCore=false

      - name: Create manifest-only package root
        if: steps.check.outputs.match == 'true' && matrix.extension.manifestOnly
        run: mkdir -p artifacts/${{ matrix.extension.name }}

      - name: Copy extension.json
        if: steps.check.outputs.match == 'true'
        run: cp ${{ matrix.extension.path }}/extension.json artifacts/${{ matrix.extension.name }}/

      - name: Copy dist payload
        if: steps.check.outputs.match == 'true' && hashFiles(format('{0}/dist/**', matrix.extension.path)) != ''
        run: cp -R ${{ matrix.extension.path }}/dist artifacts/${{ matrix.extension.name }}/ || true

      - name: Copy content-only payload
        if: steps.check.outputs.match == 'true' && matrix.extension.contentOnly
        run: cp -R ${{ matrix.extension.path }}/scrapers artifacts/${{ matrix.extension.name }}/

      - name: Stamp packaged extension.json version
        if: steps.check.outputs.match == 'true'
        run: |
          node -e "const fs=require('fs'); const file='artifacts/${{ matrix.extension.name }}/extension.json'; const json=JSON.parse(fs.readFileSync(file,'utf8')); json.version='${{ steps.check.outputs.version }}'; fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');"

      - name: Package
        if: steps.check.outputs.match == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          cd artifacts/${{ matrix.extension.name }}
          zip -r ../../${{ matrix.extension.id }}-${{ steps.check.outputs.version }}.zip .

      - name: Upload artifact
        if: steps.check.outputs.match == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}
          path: ${{ matrix.extension.id }}-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          generate_release_notes: true
      - name: Update rolling latest release & manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Ensure the rolling 'latest' release exists (never marked as repo's latest release)
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest Rolling Releases" \
              --notes "Static rolling-release ZIPs and latest-manifest.json for automatic/static-URL updates." \
              --latest=false
          fi

          # Fetch existing latest-manifest.json if present
          if ! gh release download latest -p "latest-manifest.json" -O latest-manifest.json 2>/dev/null; then
            echo '{"schemaVersion":1,"extensions":{}}' > latest-manifest.json
          fi

          UPLOAD_FILES=("latest-manifest.json")

          for zip in *.zip; do
            [ -f "$zip" ] || continue
            # Skip any *-latest.zip if already present
            [[ "$zip" == *-latest.zip ]] && continue

            unzip -p "$zip" extension.json > current-extension.json
            LATEST_ZIP=$(node -e '
              const fs = require("fs");
              const ext = JSON.parse(fs.readFileSync("current-extension.json", "utf8"));
              const manifest = JSON.parse(fs.readFileSync("latest-manifest.json", "utf8"));
              manifest.schemaVersion = 1;
              manifest.updatedAt = new Date().toISOString();
              manifest.extensions = manifest.extensions || {};
              const latestZipName = `${ext.id}-latest.zip`;
              const repo = process.env.GITHUB_REPOSITORY;
              const tag = process.env.GITHUB_REF_NAME;
              manifest.extensions[ext.id] = {
                id: ext.id,
                name: ext.name || ext.id,
                version: ext.version,
                description: ext.description || "",
                minCoveVersion: ext.minCoveVersion || null,
                downloadUrl: `https://github.com/${repo}/releases/download/latest/${latestZipName}`,
                versionedUrl: `https://github.com/${repo}/releases/download/${tag}/${process.argv[1]}`,
                updatedAt: new Date().toISOString()
              };
              fs.writeFileSync("latest-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
              process.stdout.write(latestZipName);
            ' "$zip")

            cp "$zip" "$LATEST_ZIP"
            UPLOAD_FILES+=("$LATEST_ZIP")
          done

          gh release upload latest "${UPLOAD_FILES[@]}" --clobber
